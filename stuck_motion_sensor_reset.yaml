blueprint:
  name: "Gestor de Sensores de Movimento/Presença Encravados (MQTT Reset)"
  description: >
    Deteta quando um sensor de movimento ou presença fica 'ocupado' por tempo excessivo,
    notifica o utilizador, reinicia a integração MQTT e envia uma notificação de confirmação
    assim que o sensor voltar ao estado inativo.
  domain: automation
  input:
    target_sensors:
      name: Sensores de Movimento/Presença
      description: Seleciona os sensores a monitorizar.
      selector:
        target:
          entity:
            - domain: binary_sensor
              device_class: motion
            - domain: binary_sensor
              device_class: occupancy

    stuck_timeout:
      name: Tempo Limite (Minutos)
      description: Tempo limite em estado 'ocupado' antes de considerar que o sensor encravou.
      default: 15
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min
          mode: slider

    notify_device:
      name: Dispositivo para Notificação
      description: Telemóvel que receberá os alertas.
      selector:
        device:
          integration: mobile_app

mode: parallel
max: 10

trigger:
  - platform: state
    entity_id: !input target_sensors
    to: "on"
    for:
      minutes: !input stuck_timeout

variables:
  sensor_name: "{{ state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id }}"
  triggered_entity: "{{ trigger.entity_id }}"

action:
  # 1. Notificação inicial de alerta
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "⚠️ Sensor de Movimento Encravado"
    message: "O sensor '{{ sensor_name }}' está continuamente detetado há mais de {{ stuck_timeout }} minutos. A reiniciar integração MQTT..."
    data:
      tag: "stuck_sensor_{{ triggered_entity | replace('.', '_') }}"

  # 2. Reinício correto da integração MQTT via Config Entry ID
  - service: homeassistant.reload_config_entry
    data:
      entry_id: "{{ config_entry_ids('mqtt') | first }}"
    continue_on_error: true

  # Backup: recarrega configurações relativas ao broker MQTT se aplicável
  - service: mqtt.reload
    continue_on_error: true

  # 3. Aguarda que o sensor específico que disparou volte a "off"
  - wait_for_trigger:
      - platform: template
        value_template: "{{ is_state(triggered_entity, 'off') }}"
    timeout:
      minutes: 10
    continue_on_timeout: true

  # 4. Confirmação de resolução
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "✅ Sensor Resolvido"
    message: "O sensor '{{ sensor_name }}' voltou ao estado inativo/desocupado com sucesso."
    data:
      tag: "stuck_sensor_{{ triggered_entity | replace('.', '_') }}"
