blueprint:
  name: "Notificação e Controlo de Luzes/Switches Ligados Há Muito Tempo"
  description: >
    Monitoriza luzes ou switches ligados há mais de X minutos e envia uma notificação interativa com opções para apagar ou manter ligado.
  domain: automation
  input:
    monitored_entities:
      name: Entidades a Monitorizar
      description: Seleciona as luzes ou switches que pretendes monitorizar.
      selector:
        target:
          entity:
            - domain: light
            - domain: switch

    mode:
      name: Modo de Seleção
      description: "Define se as entidades acima são uma lista de Inclusão (apenas estas) ou Exclusão (todas exceto estas)."
      default: "include"
      selector:
        select:
          options:
            - label: "Apenas as entidades selecionadas (Inclusão)"
              value: "include"
            - label: "Excluir as entidades selecionadas (Todas as outras)"
              value: "exclude"

    timeout_minutes:
      name: Tempo Limite (Minutos)
      description: Tempo em minutos que a luz/switch pode estar ligada antes de disparar o aviso.
      default: 30
      selector:
        number:
          min: 1
          max: 720
          unit_of_measurement: min
          mode: slider

    notify_device:
      name: Dispositivo para Notificação
      description: Telemóvel que irá receber a notificação push.
      selector:
        device:
          integration: mobile_app

    auto_off_after_notification:
      name: Auto-Apagar (Minutos após notificação)
      description: "Tempo em minutos a aguardar após a notificação. Se não responderes, a luz apaga-se automaticamente (0 = Desativado)."
      default: 10
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: min
          mode: slider

mode: parallel
max: 10

trigger:
  - platform: state
    entity_id:
      - light.all_lights
      - switch.all_switches
    to: "on"
    for:
      minutes: !input timeout_minutes

variables:
  select_mode: !input mode
  target_input: !input monitored_entities
  selected_entities: >
    {{ target_input.entity_id if target_input.entity_id is list else ([target_input.entity_id] if target_input.entity_id is defined else []) }}
  action_turn_off: "TURN_OFF_{{ trigger.entity_id | replace('.', '_') }}"
  action_keep_on: "KEEP_ON_{{ trigger.entity_id | replace('.', '_') }}"

condition:
  - condition: template
    value_template: >
      {% set entity = trigger.entity_id %}
      {% set is_selected = entity in selected_entities %}
      {% if select_mode == 'include' %}
        {{ is_selected }}
      {% else %}
        {{ not is_selected }}
      {% endif %}

action:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "💡 Luz / Switch ligado há muito tempo"
    message: "O dispositivo '{{ state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id }}' está ligado há mais de {{ timeout_minutes }} minutos."
    data:
      tag: "light_timeout_{{ trigger.entity_id | replace('.', '_') }}"
      actions:
        - action: "{{ action_turn_off }}"
          title: "Apagar Agora"
        - action: "{{ action_keep_on }}"
          title: "Manter Ligado"

  - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_turn_off }}"
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_keep_on }}"
    timeout:
      minutes: !input auto_off_after_notification
    continue_on_timeout: true

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ wait.trigger is none or wait.trigger.event.data.action == action_turn_off }}
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: "{{ trigger.entity_id }}"
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            message: clear_notification
            data:
              tag: "light_timeout_{{ trigger.entity_id | replace('.', '_') }}"

      - conditions:
          - condition: template
            value_template: "{{ wait.trigger is not none and wait.trigger.event.data.action == action_keep_on }}"
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            message: clear_notification
            data:
              tag: "light_timeout_{{ trigger.entity_id | replace('.', '_') }}"
