blueprint:
  name: "Notificação e Controlo Global de Luzes/Switches Ligados"
  description: >
    Monitoriza TODAS as luzes e switches da casa automaticamente. 
    Permite definir uma lista opcional de exclusão para ignorar certas entidades.
  domain: automation
  input:
    timeout_minutes:
      name: Tempo Limite (Minutos)
      description: Tempo que o dispositivo pode estar ligado antes de notificar.
      default: 30
      selector:
        number:
          min: 1
          max: 720
          unit_of_measurement: min
          mode: slider

    excluded_entities:
      name: Entidades a Excluir (Opcional)
      description: Luzes ou switches que NUNCA devem ser desligados ou notificados (ex: aquário, luzes de presença).
      default: []
      selector:
        target:
          entity:
            - domain: light
            - domain: switch

    notify_device:
      name: Dispositivo para Notificação
      description: Telemóvel que irá receber a notificação push.
      selector:
        device:
          integration: mobile_app

    auto_off_after_notification:
      name: Auto-Apagar (Minutos após notificação)
      description: Tempo a aguardar. Se não responderes à notificação, a luz apaga-se automaticamente (0 = desativado).
      default: 10
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: min
          mode: slider

mode: parallel
max: 20

trigger:
  - platform: event
    event_type: state_changed

variables:
  timeout_sec: "{{ minutes * 60 }}"
  minutes: !input timeout_minutes
  target_input: !input excluded_entities
  excluded_list: >
    {{ target_input.entity_id if target_input.entity_id is list else ([target_input.entity_id] if target_input.entity_id is defined else []) }}
  entity: "{{ trigger.event.data.entity_id }}"
  domain: "{{ entity.split('.')[0] }}"
  action_turn_off: "TURN_OFF_{{ entity | replace('.', '_') }}"
  action_keep_on: "KEEP_ON_{{ entity | replace('.', '_') }}"

condition:
  - condition: template
    value_template: >
      {{ domain in ['light', 'switch'] }}
  - condition: template
    value_template: >
      {{ entity not in excluded_list }}
  - condition: template
    value_template: >
      {{ trigger.event.data.new_state.state == 'on' }}
  - condition: template
    value_template: >
      {{ trigger.event.data.old_state.state != 'on' }}

action:
  # Aguarda o tempo limite mantendo a verificação se a luz continua ligada
  - delay:
      minutes: !input timeout_minutes

  - condition: template
    value_template: "{{ states(entity) == 'on' }}"

  # Envia notificação interativa
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "💡 Luz / Switch ligado há muito tempo"
    message: "O dispositivo '{{ state_attr(entity, 'friendly_name') or entity }}' está ligado há mais de {{ minutes }} minutos."
    data:
      tag: "light_timeout_{{ entity | replace('.', '_') }}"
      actions:
        - action: "{{ action_turn_off }}"
          title: "Apagar Agora"
        - action: "{{ action_keep_on }}"
          title: "Manter Ligado"

  # Aguarda resposta da notificação ou timeout de auto-off
  - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_turn_off }}"
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_keep_on }}"
    timeout:
      minutes: !input auto_off_after_notification
    continue_on_timeout: true

  - choose:
      # Se clicou em Apagar OU se o tempo esgotou sem resposta
      - conditions:
          - condition: template
            value_template: >
              {{ wait.trigger is none or wait.trigger.event.data.action == action_turn_off }}
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: "{{ entity }}"
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            message: clear_notification
            data:
              tag: "light_timeout_{{ entity | replace('.', '_') }}"

      # Se clicou em Manter Ligado
      - conditions:
          - condition: template
            value_template: "{{ wait.trigger is not none and wait.trigger.event.data.action == action_keep_on }}"
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            message: clear_notification
            data:
              tag: "light_timeout_{{ entity | replace('.', '_') }}"
